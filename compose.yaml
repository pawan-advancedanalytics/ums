services:
  rabbitmq:
    image: rabbitmq:4.1-management
    ports:
      - "127.0.0.1:5672:5672"
      - "127.0.0.1:15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USERNAME:-ums_dev}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-ums_dev_only}
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
volumes:
  rabbitmq-data:
